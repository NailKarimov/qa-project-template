name: Python template

# Keeps the python/ starter green. Projects created from it use python/.github/workflows/tests.yml.
on:
  push:
    branches: [main]
    paths: ['python/**', 'bench/**', '.github/workflows/python-template.yml']
  pull_request:
    paths: ['python/**', 'bench/**', '.github/workflows/python-template.yml']
  schedule:
    - cron: '20 3 * * 1' # weekly, Monday 03:20 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: tests (${{ matrix.transport }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        transport: ['memory://', 'socat://']
    defaults:
      run:
        working-directory: python
    env:
      BUS_URL: ${{ matrix.transport }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install socat
        run: sudo apt-get update -q && sudo apt-get install -y -q socat

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint and type check
        run: |
          ruff check . ../bench
          ruff format --check . ../bench
          mypy src tests scripts
          bash -n scripts/check-env.sh

      - name: Tests
        run: pytest --junitxml=junit.xml --alluredir=allure-results

      - name: Mutation check
        run: |
          python scripts/mutants.py
          cat mutants-result.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-results-${{ strategy.job-index }}
          path: |
            python/junit.xml
            python/allure-results
            python/mutants-result.md
          retention-days: 14

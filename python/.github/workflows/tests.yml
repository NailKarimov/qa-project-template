name: Tests

# Active once python/ is copied to the root of a new repository.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 * * *' # nightly, 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write # publish the Allure report to gh-pages

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - uses: actions/setup-java@v5 # Allure CLI needs Java
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q socat
          pip install -e ".[dev]"

      - name: Lint and type check
        run: |
          ruff check .
          ruff format --check .
          mypy src tests scripts

      - name: Tests in memory
        id: memory
        continue-on-error: true
        run: pytest --alluredir=allure-results

      - name: Same tests over virtual serial ports
        id: socat
        continue-on-error: true
        env:
          BUS_URL: socat://
        run: pytest --alluredir=allure-results

      - name: Mutation check
        id: mutants
        continue-on-error: true
        run: |
          python scripts/mutants.py
          cat mutants-result.md >> "$GITHUB_STEP_SUMMARY"

      - name: Allure report with history
        if: always()
        run: |
          git fetch origin gh-pages --depth=1 && git worktree add gh-pages-old origin/gh-pages \
            && cp -r gh-pages-old/history allure-results/ 2>/dev/null || true
          npx --yes allure-commandline@2 generate allure-results --clean -o allure-report
          cp mutants-result.md allure-report/ 2>/dev/null || true

      - name: Publish to GitHub Pages
        if: always() && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
          keep_files: true # guides in docs/ are published next to the report

      - name: Fail the job if anything failed
        if: steps.memory.outcome == 'failure' || steps.socat.outcome == 'failure' || steps.mutants.outcome == 'failure'
        run: exit 1

  # Nightly run on the bench. Uncomment when a self-hosted runner with the label "hil" exists.
  # Never trigger it on pull_request: code from a fork would run on your home machine.
  # hil:
  #   if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
